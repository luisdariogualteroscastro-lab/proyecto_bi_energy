# Configuracion del pipeline. Valores sensibles parametrizados via variables de entorno.
pipeline:
  nombre: ingesta_consumos
  batch_size: 5000
  reintentos: 3

origen:
  tipo: s3
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucket: raw
  access_key: ${MINIO_ACCESS_KEY}
  secret_key: ${MINIO_SECRET_KEY}

destino:
  tipo: postgres
  host: ${PG_HOST:localhost}
  port: ${PG_PORT:5432}
  database: ${PG_DATABASE:bia_datos}
  user: ${PG_SUPERUSER:postgres}
  password: ${PG_SUPERPASSWORD}

# Clave de cifrado parametrizada
cifrado:
  llave_maestra: ${LLAVE_MAESTRA}
  algoritmo: AES-256-GCM

notificaciones:
  slack_webhook: ${SLACK_WEBHOOK_URL}
