# ---------------------------------------------------------------------------
# Infraestructura local endurecida para la prueba tecnica.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: bia_pg
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERPASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-bia_datos}
      PG_ROL_INGESTA_USER: ${PG_ROL_INGESTA_USER:-rol_ingesta}
      PG_ROL_INGESTA_PASSWORD: ${PG_ROL_INGESTA_PASSWORD:-rol_ingesta_pass}
      PG_ROL_ANALISTA_USER: ${PG_ROL_ANALISTA_USER:-rol_analista}
      PG_ROL_ANALISTA_PASSWORD: ${PG_ROL_ANALISTA_PASSWORD:-rol_analista_pass}
      PG_ROL_AUDITOR_USER: ${PG_ROL_AUDITOR_USER:-rol_auditor}
      PG_ROL_AUDITOR_PASSWORD: ${PG_ROL_AUDITOR_PASSWORD:-rol_auditor_pass}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-postgres} -d ${PG_DATABASE:-bia_datos}"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bia_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: bia_redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
